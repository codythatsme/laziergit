name: verify

# `push` only for main: a PR branch already gets the full matrix from `pull_request`, and a
# second identical matrix per push doubles the queue without adding coverage.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - if: runner.os != 'Windows'
        run: bun run test:e2e

  # Deliberate async-race hunting over the renderer/git suites: repeated runs in a randomized
  # order, never retried. A failure here is a real flake — reproduce it with the printed seed.
  stress:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: Pick a shuffle seed
        id: seed
        run: echo "seed=$(od -An -N4 -tu4 /dev/urandom | tr -d ' ')" >> "$GITHUB_OUTPUT"
# One process per file, like `bun run test`: a single process spanning the whole matrix of
      # suites eventually loses subprocess stdout to a Bun runtime defect, which reads as a
      # test flake but is not one.
      - name: Stress suites (seed ${{ steps.seed.outputs.seed }})
        run: >
          bun scripts/test.ts --rerun-each 10
          --randomize --seed ${{ steps.seed.outputs.seed }}
